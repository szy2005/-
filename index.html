<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1423">
<meta name="description" content="小羊漫游马来西亚：像素风横版小游戏。">
<title>小羊漫游马来西亚 · 像素娘惹糕点大冒险</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#4a2511}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1423;touch-action:none}#game{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;z-index:3;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.hud>div{display:flex;gap:7px}.tag,.btn{border:3px solid #fff8e7;background:#1f355e;color:#fff8e7;box-shadow:3px 3px #121a2e;font-weight:800}.tag{padding:7px 9px}.btn{pointer-events:auto;padding:7px 9px;font:inherit;cursor:pointer}.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:#1a1423b8}.hidden{display:none!important}.card{width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;text-align:center;border:5px solid #4a2511;background:#fff8e7;color:#4a2511;padding:18px;box-shadow:8px 8px #121a2e}.badge{display:inline-block;background:#e0533c;color:#fff;border:3px solid #4a2511;padding:5px 9px;font-weight:900}h1{margin:10px 0 4px;font-size:clamp(28px,7vw,44px)}.subtitle{color:#d81b60;font-size:clamp(16px,4vw,22px)}.guide{margin:14px;padding:12px;text-align:left;line-height:1.7;background:#f3dec0;border:3px solid #4a2511}.primary{width:min(360px,100%);border:4px solid #4a2511;background:#4ade80;color:#14361d;box-shadow:4px 4px #4a2511;padding:13px;font:900 20px inherit;cursor:pointer}.touch{position:absolute;z-index:4;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.pad{display:flex;gap:8px;pointer-events:auto}.control{width:66px;height:66px;border:4px solid #4a2511;background:#fff8e7;color:#4a2511;box-shadow:4px 4px #121a2e;font-size:23px;font-weight:900;touch-action:none}.control.jump{background:#4ade80}.control.attack{background:#ff85a1}
</style>
</head>
<body>
<div id="game">
<canvas id="scene" aria-label="小羊像素冒险游戏画面"></canvas>
<div class="hud hidden" id="hud"><div><div class="tag" id="lives">♥♥♥</div><div class="tag" id="stageName">第1关</div><div class="tag">★ <span id="score">0</span></div></div><div><button class="btn" id="soundBtn">🔊 音乐：开</button><button class="btn" id="pauseBtn">⏸ 暂停</button></div></div>
<div class="touch hidden" id="touch"><div class="pad"><button class="control" id="left" aria-label="向左">◀</button><button class="control" id="right" aria-label="向右">▶</button></div><div class="pad"><button class="control attack" id="attack" aria-label="攻击">💖</button><button class="control jump" id="jump" aria-label="跳跃">▲</button></div></div>
<div class="overlay" id="start"><div class="card"><span class="badge">🇲🇾 16-BIT 像素南洋冒险</span><h1>小羊漫游马来西亚</h1><div class="subtitle">★ 像素娘惹糕点大冒险 ★</div><div style="font-size:70px;margin:8px">🐑</div><div class="guide"><b>方向键 ← → / A D</b> 移动<br><b>方向键 ↑ / W</b> 跳跃与二段跳<br><b>空格 / X / J</b> 发射星光波<br>收集娘惹糕点、击退捣蛋怪、抵达终点牌坊！</div><button class="primary" id="startBtn">▶ 开始像素大冒险</button></div></div>
<div class="overlay hidden" id="pause"><div class="card" style="max-width:380px"><div style="font-size:44px">🐑☕</div><h2>拉茶休息时间</h2><p>像素旋律已暂停</p><button class="primary" id="resumeBtn">▶ 继续冒险</button></div></div>
<div class="overlay hidden" id="finish"><div class="card"><div style="font-size:44px">🎉🍡✨</div><h2>关卡达成！</h2><h3>得分：<span id="finalScore">0</span></h3><button class="primary" id="nextBtn">前往下一关 ▶</button></div></div>
<div class="overlay hidden" id="gameover"><div class="card"><div style="font-size:44px">😵🌵</div><h2>哎呀，被榴莲刺到啦！</h2><button class="primary" id="retryBtn">💪 重新挑战</button></div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const stages=[{name:'第1关·马六甲红屋',width:2800,sky:'#ff9e7d',ground:'#b54434'},{name:'第2关·槟城古镇',width:3200,sky:'#4cc9f0',ground:'#4a5568'},{name:'第3关·吉隆坡星光夜',width:3500,sky:'#352565',ground:'#312e81'}];
let W=0,H=0,state='START',stage=0,score=0,cam=0,last=0,tick=0,muted=false;
const input={left:false,right:false},p={x:70,y:0,w:42,h:54,vx:0,vy:0,face:1,ground:false,jumps:2,lives:3,invuln:0,cool:0};
let foods=[],enemies=[],shots=[],platforms=[],goal=2700;

// 娘惹糕点点阵：每个字母是一块硬边像素，外描边和高光让糕点更俏皮。
const FOOD_PALETTE={O:'#4a2511',W:'#fff8e7',C:'#fffdf9',R:'#ff5577',P:'#ffacc4',G:'#35b982',L:'#a7f38c',D:'#178465',Y:'#ffca28',B:'#a95d32',K:'#74351f'};
const FOOD_SPRITES={
 lapis:['....OOOO....','...ORRRRO...','..ORRRRRRO..','.ORWWWWWWRO.','.ORPPPPPPRO.','.ORWWWWWWRO.','.ORRRRRRRRO.','..ORRRRRRO..','...OOOOOO...'],
 ketayap:['....OOOO....','..OOGGGGOO..','.OGGGGGGGGO.','OGGGGGGGGGGO','OGGLLGGGGGGO','OGGGGGGGGGGO','.OGGDDDDGGO.','..OODDDDOO..','....OOOO....'],
 serimuka:['...OOOOOO...','..OGGGGGGO..','.OGGLLLLGGO.','.OGGGGGGGGO.','.OWWWWWWWWO.','.OWCWWWWCWO.','.OWWWWWWWWO.','..OWWWWWO...','...OOOOO....'],
 angkukueh:['....OOOO....','..OO RROO...'.replaceAll(' ',''),'.ORRRRRRRO..','ORRPRRRPRRRO','ORRRRRRRRRRO','ORRRRRRRRRRO','.ORRRRRRRO..','..OGGGGGO...','...OOOOO....'],
 ondeh:['....OOOO....','..OOGG GOO..'.replaceAll(' ',''),'.OGGGLLGGGO.','OGGGGGGGGGGO','OGGGGWWGGGGO','OGGGGGGGGGGO','.OGGDDDDGGO.','..OODDDDOO..','...OOOOO....']
};
function drawPixelFood(food){
 const rows=FOOD_SPRITES[food.kind];if(!rows)return;
 const scale=3,width=rows[0].length*scale,height=rows.length*scale;
 const x=Math.round(food.x-cam),y=Math.round(food.y+Math.sin(tick*4+food.x)*4);
 // 小小像素光圈和投影，不用 emoji 或平滑图片
 ctx.fillStyle='rgba(255,248,231,.28)';ctx.fillRect(x-width/2-4,y-height/2-3,width+8,height+6);
 ctx.fillStyle='rgba(74,37,17,.22)';ctx.fillRect(x-width/2+5,y+height/2+3,width-10,3);
 for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){const color=FOOD_PALETTE[rows[r][c]];if(color){ctx.fillStyle=color;ctx.fillRect(x-width/2+c*scale,y-height/2+r*scale,scale,scale)}}
 // 闪闪小星点随时间跳变
 if(Math.floor(tick*5+food.x)%3!==0){ctx.fillStyle='#fffdf9';ctx.fillRect(x+width/2+3,y-height/2+2,3,3);ctx.fillRect(x-width/2-6,y+height/2-5,3,3)}
}

let audio=null,master=null,bgmTimer=null,bgmStep=0;
const melody=[392,0,392,440,392,330,262,0,392,0,392,440,392,330,294,0,294,0,294,330,294,247,196,0,330,349,392,440,392,330,262,0];
const bass=[131,0,196,0,131,0,196,0,131,0,196,0,147,0,196,0,147,0,196,0,123,0,196,0,131,0,165,0,196,0,131,0];
function ensureAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!audio){audio=new AC();master=audio.createGain();master.gain.value=.8;master.connect(audio.destination)}if(audio.state==='suspended')audio.resume().catch(()=>{});return true}
function beep(freq,duration=.09,volume=.07,type='square',slide=null){if(muted||!freq||!ensureAudio())return;const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.exponentialRampToValueAtTime(slide,now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(master);o.start(now);o.stop(now+duration)}
function startBgm(){stopBgm();if(muted||!ensureAudio())return;master.gain.setTargetAtTime(.8,audio.currentTime,.02);bgmTimer=setInterval(()=>{if(state==='PLAY'){const i=bgmStep++%melody.length;if(melody[i])beep(melody[i],.145,.045,'square');if(bass[i])beep(bass[i],.16,.055,'triangle');if(i%4===2)beep(900,.025,.02,'square')}},195);beep(melody[0],.16,.06,'square')}
function stopBgm(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}if(master&&audio)master.gain.setTargetAtTime(.0001,audio.currentTime,.015)}
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*Math.min(devicePixelRatio||1,2));canvas.height=Math.round(H*Math.min(devicePixelRatio||1,2));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const ground=()=>H-Math.max(66,H*.13);

// 原有小羊像素点阵与调色板保持不变。
const SHEEP_PALETTE={'O':'#3D1E10','W':'#FFF6E5','C':'#F3DEC0','S':'#DFC19A','F':'#FDE8D0','P':'#FF9EB5','R':'#FF6B8B','E':'#3A1C0E','H':'#FFFFFF','M':'#D81B60','N':'#1F355E','B':'#2A7B9B','K':'#1E1E24','T':'#E0533C'};
const SHEEP_IDLE=['.......OOOOOOOOOO.......','.....OOWWWWWWWWWWOO.....','....OWWWSSWWWWSSWWWO....','...OWWSSCCWWWWCCSSWWO...','..OWWCCWWWWWWWWWWCCWWO..','..OWCCWWSSWWWWSSWWCCWO..','.OOOWWWWWWWWWWWWWWWWOOO.','OFPPOFFFFFFFFFFFFFFOPPOF','OFPPOFFEEFFFFFFEEFFOPPOF','OFPPOFEHEFFFFFFEHEFOPPOF','OFPPOFFEEFFFFFFEEFFOPPOF','.OOOOPPFFFFRRFFFFPPOOOO.','...OOPPPFFFMMFFFPPPOO...','....OOSFFFFFFFFFSOO.....','.....OONNNWWWWNNNOO.....','....ONNNWWCCCCWWNNNO....','....ONNWWCCCCCCWWNNNO...','....ONNNWCCCCCCWNNNO....','.....OONNNNNNNNNNOO.....','....OKKKKKKKKKKKKKKO....','...OKKKKKKKKKKKKKKKKO...','...OBBBBBBBBBBBBBBBBO...','...OTTTTTTTTTTTTTTTTO...','....OKKKKKKKKKKKKKKO....','.....OOCCOO..OOCCOO.....','......OOOO....OOOO......'];
function drawSheep(sx,sy){const scale=3;ctx.save();ctx.translate(sx+p.w/2,sy+p.h/2);ctx.scale(p.face,1);ctx.translate(-36,-39);for(let r=0;r<SHEEP_IDLE.length;r++)for(let c=0;c<SHEEP_IDLE[r].length;c++){const ch=SHEEP_IDLE[r][c];if(ch!=='.'&&SHEEP_PALETTE[ch]){ctx.fillStyle=SHEEP_PALETTE[ch];ctx.fillRect(c*scale,r*scale,scale,scale)}}ctx.restore()}
function initStage(n){stage=n;const s=stages[n],gy=ground();p.x=65;p.y=gy-p.h;p.vx=p.vy=0;p.jumps=2;p.invuln=0;p.cool=0;cam=0;tick=0;shots=[];foods=[];const kinds=['lapis','ketayap','serimuka','angkukueh','ondeh'];for(let x=280,i=0;x<s.width-200;x+=290,i++)foods.push({x,y:gy-(i%3===0?145:118),kind:kinds[i%kinds.length],taken:false});enemies=[];for(let x=520;x<s.width-300;x+=430)enemies.push({x,min:x-100,max:x+180,vx:85+stage*12,w:38,h:34,alive:true});platforms=[];for(let x=300;x<s.width-180;x+=330)platforms.push({x:x+(n%2)*35,y:gy-(x%2===0?145:210),w:130,h:18});goal=s.width-150;$('stageName').textContent=s.name;updateHud()}
function updateHud(){$('score').textContent=score;$('lives').textContent='♥'.repeat(Math.max(0,p.lives))+'♡'.repeat(3-Math.max(0,p.lives))}
function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
function start(){ensureAudio();score=0;p.lives=3;initStage(0);state='PLAY';hide('start');hide('finish');hide('gameover');hide('pause');show('hud');show('touch');startBgm();last=performance.now()}
function pause(){if(state!=='PLAY')return;state='PAUSE';stopBgm();show('pause')}function resume(){state='PLAY';hide('pause');startBgm();last=performance.now()}
function jump(){if(state!=='PLAY'||p.jumps<=0)return;p.vy=p.jumps===2?-530:-475;p.jumps--;p.ground=false;beep(p.jumps===1?620:760,.11,.09,'square')}
function attack(){if(state!=='PLAY'||p.cool>0)return;p.cool=.28;shots.push({x:p.x+(p.face>0?p.w:-16),y:p.y+22,v:p.face*580,life:.9});beep(880,.08,.1,'square',440)}
function loseLife(){if(p.invuln>0)return;p.lives--;p.invuln=1.4;p.vy=-310;p.vx=p.x<cam+W/2?-210:210;updateHud();beep(210,.18,.13,'sawtooth',90);if(p.lives<=0){state='OVER';stopBgm();show('gameover')}}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function win(){if(state!=='PLAY')return;state='WIN';stopBgm();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,.1,'square'),i*110));$('finalScore').textContent=score;show('finish')}
function update(dt){if(state!=='PLAY')return;tick+=dt;const s=stages[stage],gy=ground();p.cool=Math.max(0,p.cool-dt);p.invuln=Math.max(0,p.invuln-dt);p.vx=input.left?-240:input.right?240:p.vx*.75;if(input.left)p.face=-1;if(input.right)p.face=1;const old=p.y+p.h;p.x=Math.max(0,Math.min(s.width-p.w,p.x+p.vx*dt));p.vy+=1350*dt;p.y+=p.vy*dt;p.ground=false;if(p.y+p.h>=gy){p.y=gy-p.h;p.vy=0;p.ground=true;p.jumps=2}for(const q of platforms)if(p.vy>=0&&p.x+p.w>q.x&&p.x<q.x+q.w&&old<=q.y+8&&p.y+p.h>=q.y){p.y=q.y-p.h;p.vy=0;p.ground=true;p.jumps=2}cam=Math.max(0,Math.min(s.width-W,p.x-W*.35));
for(let i=shots.length-1;i>=0;i--){const a=shots[i];a.x+=a.v*dt;a.life-=dt;let hit=false;for(const e of enemies)if(e.alive&&a.x<e.x+e.w&&a.x+16>e.x&&a.y<gy&&a.y+16>gy-e.h){e.alive=false;score+=200;updateHud();hit=true;beep(680,.09,.09,'square');break}if(hit||a.life<=0||a.x<0||a.x>s.width)shots.splice(i,1)}
for(const f of foods)if(!f.taken&&Math.hypot(p.x+p.w/2-f.x,p.y+p.h/2-f.y)<40){f.taken=true;score+=150;if(p.lives<3)p.lives++;updateHud();beep(523,.07,.08,'square');setTimeout(()=>beep(659,.07,.08,'square'),50);setTimeout(()=>beep(784,.1,.08,'square'),100)}
for(const e of enemies)if(e.alive){e.x+=e.vx*dt;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(rectHit(p,{x:e.x,y:gy-e.h,w:e.w,h:e.h}))if(p.vy>100&&old<=gy-e.h+16){e.alive=false;p.vy=-390;score+=200;updateHud()}else loseLife()}if(p.x+35>=goal)win()}
function draw(){const s=stages[stage],gy=ground();ctx.fillStyle=s.sky;ctx.fillRect(0,0,W,gy);ctx.fillStyle=stage===2?'#fff59d':'#fffdf9';for(let i=0;i<8;i++){const x=((i*230-cam*.12)%(W+200)+W+200)%(W+200),y=55+(i%3)*35;ctx.fillRect(x,y,50,10);ctx.fillRect(x+10,y-8,30,8)}ctx.fillStyle=s.ground;ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#52b788';ctx.fillRect(0,gy,W,10);for(let x=-(cam%36);x<W;x+=36)ctx.fillRect(x,gy+18,4,H);for(const q of platforms){ctx.fillStyle='#4a2511';ctx.fillRect(q.x-cam,q.y,q.w,q.h);ctx.fillStyle='#ffca28';ctx.fillRect(q.x-cam+3,q.y+3,q.w-6,5)}for(const f of foods)if(!f.taken)drawPixelFood(f);for(const e of enemies)if(e.alive){ctx.font='34px serif';ctx.textAlign='center';ctx.fillText(e.x%2?'🌶️':'🌿',e.x-cam,gy-5)}const gx=goal-cam;ctx.fillStyle='#4a2511';ctx.fillRect(gx,gy-130,16,130);ctx.fillRect(gx+82,gy-130,16,130);ctx.fillStyle='#ffca28';ctx.fillRect(gx-12,gy-148,122,25);ctx.fillStyle='#4a2511';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('美食终点',gx+49,gy-131);for(const a of shots){ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('★',a.x-cam,a.y+22)}if(!(p.invuln>0&&Math.floor(p.invuln*12)%2===0))drawSheep(p.x-cam,p.y)}
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
$('startBtn').onclick=start;$('pauseBtn').onclick=pause;$('resumeBtn').onclick=resume;$('retryBtn').onclick=()=>{hide('gameover');p.lives=3;initStage(stage);state='PLAY';startBgm()};$('nextBtn').onclick=()=>{hide('finish');if(stage===2)start();else{p.lives=Math.min(3,p.lives+1);initStage(stage+1);state='PLAY';startBgm()}};$('soundBtn').onclick=()=>{ensureAudio();muted=!muted;$('soundBtn').textContent=muted?'🔇 音乐：关':'🔊 音乐：开';if(muted)stopBgm();else if(state==='PLAY')startBgm()};
function bind(id,key){const el=$(id),down=e=>{e.preventDefault();input[key]=true},up=e=>{e.preventDefault();input[key]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}bind('left','left');bind('right','right');$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('attack').onpointerdown=e=>{e.preventDefault();attack()};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Space'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=true;if(['ArrowUp','w','W',' ','Space'].includes(e.key)&&!e.repeat)jump();if(['x','X','j','J'].includes(e.key)&&!e.repeat)attack();if(['p','P','Escape'].includes(e.key))state==='PLAY'?pause():state==='PAUSE'&&resume()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=false});addEventListener('blur',()=>{input.left=input.right=false});initStage(0);
})();
</script>
</body>
</html>
