<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>小羊漫游马来西亚 · 像素娘惹糕点大冒险</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#4a2511;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a1423;touch-action:none}#game{position:relative;width:100%;height:100%}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;z-index:3;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.hud>div{display:flex;gap:7px}.tag,.btn{border:3px solid #fff8e7;background:#1f355e;color:#fff8e7;box-shadow:3px 3px 0 #121a2e;font-weight:800}.tag{padding:7px 9px}.btn{pointer-events:auto;cursor:pointer;padding:7px 9px;font:inherit}.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;background:#1a1423b8}.hidden{display:none!important}.card{width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;text-align:center;border:5px solid #4a2511;background:#fff8e7;color:#4a2511;padding:18px;box-shadow:8px 8px 0 #121a2e}.badge{display:inline-block;background:#e0533c;color:#fff;border:3px solid #4a2511;padding:5px 9px;font-weight:900}h1{margin:10px 0 4px;font-size:clamp(28px,7vw,44px)}h2{margin:8px 0}.subtitle{color:#d81b60;font-size:clamp(16px,4vw,22px)}.guide{margin:14px 0;padding:12px;text-align:left;line-height:1.7;background:#f3dec0;border:3px solid #4a2511}.primary{width:min(360px,100%);border:4px solid #4a2511;background:#4ade80;color:#14361d;box-shadow:inset -4px -4px #16a34a,inset 4px 4px #bbf7d0,4px 4px #4a2511;padding:13px;font:900 20px inherit;cursor:pointer}.touch{position:absolute;z-index:4;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.pad{display:flex;gap:8px;pointer-events:auto}.control{width:66px;height:66px;border:4px solid #4a2511;border-radius:0;background:#fff8e7dc;color:#4a2511;box-shadow:4px 4px #121a2e;font-size:23px;font-weight:900;touch-action:none}.control.jump{background:#4ade80}.control.attack{background:#ff85a1}
</style>
</head>
<body>
<div id="game">
<canvas id="scene" aria-label="像素风平台冒险游戏画面"></canvas>
<div class="hud hidden" id="hud"><div><div class="tag" id="lives">♥♥♥</div><div class="tag" id="stageName">第1关</div><div class="tag">★ <span id="score">0</span></div></div><div><button class="btn" id="soundBtn">🔊 音乐：开</button><button class="btn" id="pauseBtn">⏸ 暂停</button></div></div>
<div class="touch hidden" id="touch"><div class="pad"><button class="control" id="left">◀</button><button class="control" id="right">▶</button></div><div class="pad"><button class="control attack" id="attack">💖</button><button class="control jump" id="jump">▲</button></div></div>
<div class="overlay" id="start"><div class="card"><span class="badge">🇲🇾 16-BIT 像素南洋冒险</span><h1>小羊漫游马来西亚</h1><div class="subtitle">★ 像素娘惹糕点大冒险 ★</div><div style="font-size:70px;margin:8px">🐑</div><div class="guide"><b>方向键 ← → / A D</b> 移动<br><b>方向键 ↑ / W</b> 跳跃与二段跳<br><b>空格 / X / J</b> 发射爱心星光波<br>收集娘惹糕点、击退捣蛋怪、抵达终点牌坊！</div><button class="primary" id="startBtn">▶ 开始像素大冒险</button></div></div>
<div class="overlay hidden" id="pause"><div class="card" style="max-width:380px"><div style="font-size:44px">🐑☕</div><h2>拉茶休息时间</h2><p>可爱的像素旋律暂停了</p><button class="primary" id="resumeBtn">▶ 继续冒险</button></div></div>
<div class="overlay hidden" id="finish"><div class="card" style="max-width:440px"><div style="font-size:44px">🎉🍡✨</div><h2>关卡达成！</h2><p>小羊品尝到了超美味的娘惹糕点！</p><h3>得分：<span id="finalScore">0</span></h3><button class="primary" id="nextBtn">前往下一关 ▶</button></div></div>
<div class="overlay hidden" id="gameover"><div class="card" style="max-width:400px"><div style="font-size:44px">😵🌵</div><h2>哎呀，被榴莲刺到啦！</h2><button class="primary" id="retryBtn">💪 重新挑战</button></div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const stages=[
{name:'第1关·马六甲红屋',width:2800,sky:'#ff9e7d',ground:'#b54434',accent:'#c84b31'},
{name:'第2关·槟城娘惹古镇',width:3200,sky:'#4cc9f0',ground:'#4a5568',accent:'#2a9d8f'},
{name:'第3关·吉隆坡星光夜',width:3500,sky:'#352565',ground:'#312e81',accent:'#4338ca'}];
let W=0,H=0,state='START',stage=0,score=0,cam=0,last=0,tick=0,muted=false;
const input={left:false,right:false},p={x:70,y:0,w:42,h:54,vx:0,vy:0,face:1,ground:false,jumps:2,lives:3,invuln:0,cool:0};
let foods=[],enemies=[],shots=[],platforms=[],goal=2700;

// 可爱的 8-bit 像素芯片背景音乐：旋律、低音与轻巧打击乐循环
let audio=null,bgmTimer=null,bgmStep=0;
const melody=[392,0,392,440,392,330,262,0,392,0,392,440,392,330,294,0,294,0,294,330,294,247,196,0,330,349,392,440,392,330,262,0];
const bass=[131,0,196,0,131,0,196,0,131,0,196,0,147,0,196,0,147,0,196,0,123,0,196,0,131,0,165,0,196,0,131,0];
function ensureAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)()}if(audio.state==='suspended')audio.resume();}
function beep(freq,duration=.09,volume=.07,type='square',slide=null){if(muted||!freq)return;ensureAudio();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(slide)o.frequency.exponentialRampToValueAtTime(slide,now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration)}
function startBgm(){ensureAudio();if(bgmTimer||muted)return;bgmTimer=setInterval(()=>{if(state==='PLAY'&&!muted){const i=bgmStep++%melody.length;if(melody[i])beep(melody[i],.145,.035,'square');if(bass[i])beep(bass[i],.16,.045,'triangle');if(i%4===2)beep(900,.025,.018,'square')}},195)}
function stopBgm(){clearInterval(bgmTimer);bgmTimer=null}

function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*Math.min(devicePixelRatio||1,2));canvas.height=Math.round(H*Math.min(devicePixelRatio||1,2));ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const ground=()=>H-Math.max(66,H*.13);
function initStage(n){stage=n;const s=stages[n],gy=ground();p.x=65;p.y=gy-p.h;p.vx=p.vy=0;p.jumps=2;p.invuln=0;p.cool=0;cam=0;tick=0;shots=[];foods=[];for(let x=280;x<s.width-200;x+=290){foods.push({x,y:gy-(x%870===280?145:118),type:['🍡','🍬','🌸','🌺','🟢'][Math.floor(x/290)%5],taken:false})}enemies=[];for(let x=520;x<s.width-300;x+=430)enemies.push({x,min:x-100,max:x+180,vx:85+(stage*12),w:38,h:34,alive:true});platforms=[];for(let x=300;x<s.width-180;x+=330)platforms.push({x:x+(n%2)*35,y:gy-(x%2===0?145:210),w:130,h:18});goal=s.width-150;$('stageName').textContent=s.name;updateHud()}
function updateHud(){ $('score').textContent=score;$('lives').textContent='♥'.repeat(Math.max(0,p.lives))+'♡'.repeat(3-Math.max(0,p.lives)); }
function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}
function start(){ensureAudio();score=0;p.lives=3;initStage(0);state='PLAY';hide('start');hide('finish');hide('gameover');hide('pause');show('hud');show('touch');startBgm();last=performance.now()}
function pause(){if(state!=='PLAY')return;state='PAUSE';stopBgm();show('pause')}function resume(){state='PLAY';hide('pause');startBgm();last=performance.now()}
function jump(){if(state!=='PLAY'||p.jumps<=0)return;p.vy=p.jumps===2?-530:-475;p.jumps--;p.ground=false;beep(p.jumps===1?620:760,.11,.09,'square')}
function attack(){if(state!=='PLAY'||p.cool>0)return;p.cool=.28;shots.push({x:p.x+(p.face>0?p.w:-16),y:p.y+22,v:p.face*580,life:.9});beep(880,.08,.1,'square',440);setTimeout(()=>beep(1175,.12,.09,'triangle'),40)}
function loseLife(){if(p.invuln>0)return;p.lives--;p.invuln=1.4;p.vy=-310;p.vx=p.x<cam+W/2?-210:210;updateHud();beep(210,.18,.13,'sawtooth',90);if(p.lives<=0){state='OVER';stopBgm();show('gameover')}}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function win(){if(state!=='PLAY')return;state='WIN';stopBgm();beep(523,.16,.1,'square');setTimeout(()=>beep(659,.16,.1,'square'),110);setTimeout(()=>beep(784,.16,.1,'square'),220);setTimeout(()=>beep(1047,.35,.11,'square'),330);$('finalScore').textContent=score;show('finish');$('nextBtn').textContent=stage===2?'再次环游马来西亚':'前往下一关 ▶'}
function update(dt){if(state!=='PLAY')return;tick+=dt;const s=stages[stage],gy=ground();p.cool=Math.max(0,p.cool-dt);p.invuln=Math.max(0,p.invuln-dt);p.vx=input.left?-240:input.right?240:p.vx*.75;if(input.left)p.face=-1;if(input.right)p.face=1;const old=p.y+p.h;p.x=Math.max(0,Math.min(s.width-p.w,p.x+p.vx*dt));p.vy+=1350*dt;p.y+=p.vy*dt;p.ground=false;if(p.y+p.h>=gy){p.y=gy-p.h;p.vy=0;p.ground=true;p.jumps=2}for(const q of platforms)if(p.vy>=0&&p.x+p.w>q.x&&p.x<q.x+q.w&&old<=q.y+8&&p.y+p.h>=q.y){p.y=q.y-p.h;p.vy=0;p.ground=true;p.jumps=2}cam=Math.max(0,Math.min(s.width-W,p.x-W*.35));
for(let i=shots.length-1;i>=0;i--){const a=shots[i];a.x+=a.v*dt;a.life-=dt;let hit=false;for(const e of enemies)if(e.alive&&a.x<e.x+e.w&&a.x+16>e.x&&a.y<gy&&a.y+16>gy-e.h){e.alive=false;score+=200;updateHud();hit=true;beep(680,.09,.09,'square');break}if(hit||a.life<=0||a.x<0||a.x>s.width)shots.splice(i,1)}
for(const f of foods)if(!f.taken&&Math.hypot(p.x+p.w/2-f.x,p.y+p.h/2-f.y)<38){f.taken=true;score+=150;if(p.lives<3)p.lives++;updateHud();beep(523,.07,.08,'square');setTimeout(()=>beep(659,.07,.08,'square'),50);setTimeout(()=>beep(784,.1,.08,'square'),100)}
for(const e of enemies)if(e.alive){e.x+=e.vx*dt;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(rectHit(p,{x:e.x,y:gy-e.h,w:e.w,h:e.h}))if(p.vy>100&&old<=gy-e.h+16){e.alive=false;p.vy=-390;score+=200;updateHud();beep(320,.12,.1,'sawtooth',120)}else loseLife()}if(p.x+35>=goal)win()}

function drawSheep(x,y){ctx.save();ctx.translate(Math.round(x+p.w/2),Math.round(y+p.h/2));ctx.scale(p.face,1);ctx.translate(-27,-31);const wool=['#fff6e5','#f3dec0','#dfc19a','#ff9eb5'],outline='#3d1e10';ctx.fillStyle=outline;ctx.fillRect(8,0,38,4);ctx.fillRect(4,4,46,8);ctx.fillRect(0,12,54,22);ctx.fillStyle=wool[(Math.floor(tick*4)%2)];ctx.fillRect(5,6,44,25);ctx.fillStyle=outline;ctx.fillRect(14,16,5,5);ctx.fillRect(35,16,5,5);ctx.fillStyle='#fff';ctx.fillRect(15,16,2,2);ctx.fillRect(36,16,2,2);ctx.fillStyle='#ff9eb5';ctx.fillRect(8,27,8,5);ctx.fillRect(38,27,8,5);ctx.fillStyle='#1f355e';ctx.fillRect(10,36,34,17);ctx.fillStyle='#2a7b9b';ctx.fillRect(12,42,30,11);ctx.fillStyle='#1e1e24';ctx.fillRect(8,50,38,4);ctx.restore()}
function draw(){const s=stages[stage],gy=ground();ctx.fillStyle=s.sky;ctx.fillRect(0,0,W,gy);ctx.fillStyle=stage===2?'#fff59d':'#fffdf9';for(let i=0;i<8;i++){const x=((i*230-cam*.12)% (W+200)+W+200)%(W+200)-60,y=55+(i%3)*35;ctx.fillRect(x,y,50,10);ctx.fillRect(x+10,y-8,30,8)}ctx.fillStyle='#c84b31';for(let i=0;i<10;i++){const x=((i*260-cam*.25)% (W+300)+W+300)%(W+300)-100;ctx.fillRect(x,gy-85,110,85);ctx.fillStyle='#fff8e7';ctx.fillRect(x+12,gy-72,18,20);ctx.fillRect(x+80,gy-72,18,20);ctx.fillStyle='#c84b31'}ctx.fillStyle=s.ground;ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#52b788';ctx.fillRect(0,gy,W,10);ctx.fillStyle='#2d3748';for(let x=-(cam%36);x<W;x+=36){ctx.fillRect(x,gy+18,4,H);ctx.fillRect(x+18,gy+38,4,H)}for(const q of platforms){ctx.fillStyle='#4a2511';ctx.fillRect(q.x-cam,q.y,q.w,q.h);ctx.fillStyle='#ffca28';ctx.fillRect(q.x-cam+3,q.y+3,q.w-6,5);ctx.fillStyle='#d97706';ctx.fillRect(q.x-cam+3,q.y+8,q.w-6,q.h-11)}for(const f of foods)if(!f.taken){const y=f.y+Math.sin(tick*4+f.x)*5;ctx.font='28px serif';ctx.textAlign='center';ctx.fillText(f.type,f.x-cam,y)}for(const e of enemies)if(e.alive){ctx.font='34px serif';ctx.textAlign='center';ctx.fillText(e.x%2?'🌶️':'🌿',e.x-cam,gy-5)}const gx=goal-cam;ctx.fillStyle='#4a2511';ctx.fillRect(gx,gy-130,16,130);ctx.fillRect(gx+82,gy-130,16,130);ctx.fillStyle='#ffca28';ctx.fillRect(gx-12,gy-148,122,25);ctx.fillStyle='#4a2511';ctx.textAlign='center';ctx.font='bold 13px sans-serif';ctx.fillText('美食终点',gx+49,gy-130);for(const a of shots){ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('★',a.x-cam,a.y+22)}if(!(p.invuln>0&&Math.floor(p.invuln*12)%2===0))drawSheep(p.x-cam,p.y)}
function loop(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
$('startBtn').onclick=start;$('pauseBtn').onclick=pause;$('resumeBtn').onclick=resume;$('retryBtn').onclick=()=>{hide('gameover');p.lives=3;initStage(stage);state='PLAY';startBgm()};$('nextBtn').onclick=()=>{hide('finish');if(stage===2){start()}else{p.lives=Math.min(3,p.lives+1);initStage(stage+1);state='PLAY';startBgm()}};$('soundBtn').onclick=()=>{ensureAudio();muted=!muted;$('soundBtn').textContent=muted?'🔇 音乐：关':'🔊 音乐：开';if(muted)stopBgm();else if(state==='PLAY')startBgm()};
function bind(id,key){const el=$(id),down=e=>{e.prevent.preventDefault();input[key]=true},up=e=>{e.preventDefault();input[key]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}bind('left','left');bind('right','right');$('jump').onpointerdown=e=>{e.preventDefault();jump()};$('attack').onpointerdown=e=>{e.preventDefault();attack()};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Space'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=true;if(['ArrowUp','w','W',' ','Space'].includes(e.key)&&!e.repeat)jump();if(['x','X','j','J'].includes(e.key)&&!e.repeat)attack();if(['p','P','Escape'].includes(e.key))state==='PLAY'?pause():state==='PAUSE'&&resume()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')input.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')input.right=false});addEventListener('blur',()=>{input.left=input.right=false});initStage(0);
})();
</script>
</body>
</html>
